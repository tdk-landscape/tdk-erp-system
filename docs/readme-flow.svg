<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" fill="none">
  <defs>
    <linearGradient id="flow-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="step1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="step2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="step3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="step4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#flow-bg)" rx="12"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">
    TDK Generation Flow
  </text>
  <text x="600" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">
    From service.json to running enterprise landscape
  </text>

  <!-- Flow Steps -->
  <g transform="translate(80, 100)">
    <!-- Step 1: service.json -->
    <rect x="0" y="0" width="200" height="120" rx="12" fill="url(#step1)" opacity="0.9"/>
    <text x="100" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="white">1. Declare</text>
    <text x="100" y="55" text-anchor="middle" font-family="monospace" font-size="12" fill="white">service.json</text>
    <text x="100" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="white" opacity="0.9">100 manifests</text>
    <text x="100" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="white" opacity="0.9">Domain-organized</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(290, 150)">
    <text x="30" y="10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#64748b">→</text>
  </g>

  <g transform="translate(340, 100)">
    <!-- Step 2: tdk up -->
    <rect x="0" y="0" width="200" height="120" rx="12" fill="url(#step2)" opacity="0.9"/>
    <text x="100" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="white">2. Generate</text>
    <text x="100" y="55" text-anchor="middle" font-family="monospace" font-size="12" fill="white">tdk up</text>
    <text x="100" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="white" opacity="0.9">Auto-discovery</text>
    <text x="100" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="white" opacity="0.9">Port allocation</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(550, 150)">
    <text x="30" y="10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#64748b">→</text>
  </g>

  <g transform="translate(600, 100)">
    <!-- Step 3: .autogenerated -->
    <rect x="0" y="0" width="200" height="120" rx="12" fill="url(#step3)" opacity="0.9"/>
    <text x="100" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="white">3. Build</text>
    <text x="100" y="55" text-anchor="middle" font-family="monospace" font-size="12" fill="white">.autogenerated/</text>
    <text x="100" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="white" opacity="0.9">Docker files</text>
    <text x="100" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="white" opacity="0.9">Env configs</text>
  </g>

  <!-- Arrow 3 -->
  <g transform="translate(810, 150)">
    <text x="30" y="10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#64748b">→</text>
  </g>

  <g transform="translate(860, 100)">
    <!-- Step 4: Running -->
    <rect x="0" y="0" width="200" height="120" rx="12" fill="url(#step4)" opacity="0.9"/>
    <text x="100" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="white">4. Run</text>
    <text x="100" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="white">100 Services</text>
    <text x="100" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="white" opacity="0.9">Health checks</text>
    <text x="100" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="white" opacity="0.9">Live monitoring</text>
  </g>

  <!-- Generated Artifacts -->
  <g transform="translate(100, 250)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">Generated Artifacts:</text>
    <text x="0" y="20" font-family="monospace" font-size="11" fill="#64748b">• Dockerfile per service</text>
    <text x="200" y="20" font-family="monospace" font-size="11" fill="#64748b">• Tilt resources</text>
    <text x="350" y="20" font-family="monospace" font-size="11" fill="#64748b">• Environment variables</text>
    <text x="520" y="20" font-family="monospace" font-size="11" fill="#64748b">• TypeScript types</text>
    <text x="680" y="20" font-family="monospace" font-size="11" fill="#64748b">• Vite configs</text>
    <text x="820" y="20" font-family="monospace" font-size="11" fill="#64748b">• Health checks</text>
  </g>

  <!-- Key Point -->
  <text x="600" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" font-style="italic">
    Edit service.json → TDK regenerates → No manual infrastructure code
  </text>
</svg>