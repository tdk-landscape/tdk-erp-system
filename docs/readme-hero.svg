<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="600" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="48" font-weight="bold" fill="white">
    TDK Enterprise ERP System
  </text>
  <text x="600" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="white" opacity="0.9">
    100 Microservices Across 7 Business Domains
  </text>

  <!-- Service Cards -->
  <g transform="translate(100, 160)">
    <!-- Finance -->
    <rect x="0" y="0" width="140" height="180" rx="8" fill="url(#card1)" opacity="0.9"/>
    <text x="70" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="white">Finance</text>
    <text x="70" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="white">15 Services</text>
    <text x="70" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="white" opacity="0.8">GL, AP/AR, Budgeting</text>
    <text x="70" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="white" opacity="0.8">Tax, Assets, Analytics</text>
  </g>

  <g transform="translate(260, 160)">
    <!-- HR -->
    <rect x="0" y="0" width="140" height="180" rx="8" fill="url(#card2)" opacity="0.9"/>
    <text x="70" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="white">HR</text>
    <text x="70" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="white">12 Services</text>
    <text x="70" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="white" opacity="0.8">Records, Recruitment</text>
    <text x="70" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="white" opacity="0.8">Performance, Benefits</text>
  </g>

  <g transform="translate(420, 160)">
    <!-- Inventory -->
    <rect x="0" y="0" width="140" height="180" rx="8" fill="url(#card3)" opacity="0.9"/>
    <text x="70" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="white">Inventory</text>
    <text x="70" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="white">18 Services</text>
    <text x="70" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="white" opacity="0.8">Management, Warehouse</text>
    <text x="70" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="white" opacity="0.8">Forecasting, Tracking</text>
  </g>

  <g transform="translate(580, 160)">
    <!-- Sales -->
    <rect x="0" y="0" width="140" height="180" rx="8" fill="url(#card1)" opacity="0.9"/>
    <text x="70" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="white">Sales</text>
    <text x="70" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="white">20 Services</text>
    <text x="70" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="white" opacity="0.8">CRM, Orders, Pricing</text>
    <text x="70" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="white" opacity="0.8">Analytics, Forecasting</text>
  </g>

  <g transform="translate(740, 160)">
    <!-- Manufacturing -->
    <rect x="0" y="0" width="140" height="180" rx="8" fill="url(#card2)" opacity="0.9"/>
    <text x="70" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="white">Manufacturing</text>
    <text x="70" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="white">15 Services</text>
    <text x="70" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="white" opacity="0.8">Planning, Quality</text>
    <text x="70" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="white" opacity="0.8">Maintenance, BOM</text>
  </g>

  <g transform="translate(900, 160)">
    <!-- Supply Chain -->
    <rect x="0" y="0" width="140" height="180" rx="8" fill="url(#card3)" opacity="0.9"/>
    <text x="70" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="white">Supply Chain</text>
    <text x="70" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="white">12 Services</text>
    <text x="70" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="white" opacity="0.8">Procurement, Logistics</text>
    <text x="70" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="white" opacity="0.8">Planning, Analytics</text>
  </g>

  <!-- Analytics spanning -->
  <g transform="translate(200, 360)">
    <rect x="0" y="0" width="800" height="30" rx="8" fill="white" opacity="0.2"/>
    <text x="400" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="white">
      Analytics (8 Services) - BI, Data Warehouse, Reporting, ML
    </text>
  </g>

  <!-- Footer stats -->
  <text x="600" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="white" opacity="0.7">
    Declare service.json → tdk up → Enterprise ERP Landscape
  </text>
</svg>