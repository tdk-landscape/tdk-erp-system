      - "traefik.http.routers.tax-compliance-api-project.rule=Host(`api.tdk-erp-system.localhost`) && PathPrefix(`/api/tax-compliance`)"
      - "traefik.http.routers.tax-compliance-api-project.entrypoints=web"
      - "traefik.http.routers.tax-compliance-api-project.service=tax-compliance-api"
      - "traefik.http.routers.tax-compliance-api-project.middlewares=tax-compliance-api-strip-prefix-project"
      - "traefik.http.middlewares.tax-compliance-api-strip-prefix-project.stripprefix.prefixes=/api/tax-compliance"
      - "traefik.http.routers.tax-compliance-api-project.priority=119"

      - "traefik.http.routers.tax-compliance-api-management.rule=Host(`api.tdk-erp-system.localhost`) && PathPrefix(`/api/finance-management`)"
      - "traefik.http.routers.tax-compliance-api-management.entrypoints=web"
      - "traefik.http.routers.tax-compliance-api-management.service=tax-compliance-api"
      - "traefik.http.routers.tax-compliance-api-management.middlewares=tax-compliance-api-strip-prefix-management"
      - "traefik.http.middlewares.tax-compliance-api-strip-prefix-management.stripprefix.prefixes=/api/finance-management"
      - "traefik.http.routers.tax-compliance-api-management.priority=123"

      # Redirect middleware for URL restructuring: old path -> new path
      - "traefik.http.middlewares.tax-compliance-api-redirect.redirectregex.regex=^`/finance-management/api/v1/(.*)`"
      - "traefik.http.middlewares.tax-compliance-api-redirect.redirectregex.replacement=`/api/tax-compliance/$$1`"
      - "traefik.http.middlewares.tax-compliance-api-redirect.redirectregex.permanent=true"

    networks:
      - tdk_erp_system_traefik-public
      - tdk_erp_system_backend
      - tdk_erp_system_database
      - tdk_erp_system_infisical-network
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "5", "http://localhost:4016/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    # Note: depends_on removed - Tilt manages service startup order
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M

networks:
  tdk_erp_system_traefik-public:
    external: true
  tdk_erp_system_backend:
    external: true
  tdk_erp_system_database:
    external: true
  tdk_erp_system_infisical-network:
    external: true
