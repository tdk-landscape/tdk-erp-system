      - DATABASE_URL=postgresql://tdk_erp_system:${DB_PASSWORD}@tdk_erp_system_postgres:5432/tdk_erp_system_hr?schema=public
      - AUTH_MODE=identity-service
      - IDENTITY_RESOURCE_URL=${IDENTITY_RESOURCE_URL:-None}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.workforce-planning-api.rule=Host(`hr.backend.tdk_erp_system.local`)"
      - "traefik.http.routers.workforce-planning-api.entrypoints=web"
      - "traefik.http.routers.workforce-planning-api.service=workforce-planning-api"

      - "traefik.http.services.workforce-planning-api.loadbalancer.server.port=*backend-port"
      - "traefik.http.services.workforce-planning-api.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.workforce-planning-api.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.workforce-planning-api.loadbalancer.healthcheck.timeout=5s"
      - "traefik.http.services.workforce-planning-api.loadbalancer.healthcheck.followredirects=false"
      - "traefik.docker.network=tdk_erp_system_traefik-public"

      - "traefik.http.routers.workforce-planning-api-project.rule=Host(`api.tdk-erp-system.localhost`) && PathPrefix(`/api/hr-management`)"
      - "traefik.http.routers.workforce-planning-api-project.entrypoints=web"
      - "traefik.http.routers.workforce-planning-api-project.service=workforce-planning-api"
      - "traefik.http.routers.workforce-planning-api-project.middlewares=workforce-planning-api-strip-prefix-project"
      - "traefik.http.middlewares.workforce-planning-api-strip-prefix-project.stripprefix.prefixes=/api/hr-management"
      - "traefik.http.routers.workforce-planning-api-project.priority=118"

      # Redirect middleware for URL restructuring: old path -> new path
      - "traefik.http.middlewares.workforce-planning-api-redirect.redirectregex.regex=^`/hr-management/api/v1/(.*)`"
      - "traefik.http.middlewares.workforce-planning-api-redirect.redirectregex.replacement=`/api/hr-management/$$1`"
      - "traefik.http.middlewares.workforce-planning-api-redirect.redirectregex.permanent=true"

    networks:
      - tdk_erp_system_traefik-public
      - tdk_erp_system_backend
      - tdk_erp_system_database
      - tdk_erp_system_infisical-network
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "5", "http://localhost:4109/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      # STORY 4 FIX: 30s grace period to prevent 504 errors during startup
      # Services get 30s to initialize before health checks begin
      start_period: 30s
    # Note: depends_on removed - Tilt manages service startup order
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M

networks:
  tdk_erp_system_traefik-public:
    external: true
  tdk_erp_system_backend:
    external: true
  tdk_erp_system_database:
    external: true
  tdk_erp_system_infisical-network:
    external: true
