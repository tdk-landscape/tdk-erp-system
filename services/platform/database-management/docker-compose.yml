services:
  postgres:
    image: postgres:16-alpine
    container_name: tdk_erp_system_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tdk_erp_system
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - tdk_erp_system_postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tdk_erp_system -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  database:
    name: tdk_erp_system_database
    external: true

volumes:
  tdk_erp_system_postgres_data:
