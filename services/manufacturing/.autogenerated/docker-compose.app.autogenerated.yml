      - "traefik.http.routers.work-order-api-management.entrypoints=web"
      - "traefik.http.routers.work-order-api-management.service=work-order-api"
      - "traefik.http.routers.work-order-api-management.middlewares=work-order-api-strip-prefix-management"
      - "traefik.http.middlewares.work-order-api-strip-prefix-management.stripprefix.prefixes=/api/manufacturing-management"
      - "traefik.http.routers.work-order-api-management.priority=129"

      # Redirect middleware for URL restructuring: old path -> new path
      - "traefik.http.middlewares.work-order-api-redirect.redirectregex.regex=^`/manufacturing-management/api/v1/(.*)`"
      - "traefik.http.middlewares.work-order-api-redirect.redirectregex.replacement=`/api/work-order/$$1`"
      - "traefik.http.middlewares.work-order-api-redirect.redirectregex.permanent=true"

    networks:
      - tdk_erp_system_traefik-public
      - tdk_erp_system_backend
      - tdk_erp_system_database
      - tdk_erp_system_infisical-network
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "5", "http://localhost:4405/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    # Note: depends_on removed - Tilt manages service startup order
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M

networks:
  tdk_erp_system_traefik-public:
    external: true
  tdk_erp_system_backend:
    external: true
  tdk_erp_system_database:
    external: true
  tdk_erp_system_infisical-network:
    external: true
