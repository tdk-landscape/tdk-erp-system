      - "traefik.http.middlewares.stock-movement-api-redirect.redirectregex.regex=^`/inventory-management/api/v1/(.*)`"
      - "traefik.http.middlewares.stock-movement-api-redirect.redirectregex.replacement=`/api/inventory-management/$$1`"
      - "traefik.http.middlewares.stock-movement-api-redirect.redirectregex.permanent=true"

