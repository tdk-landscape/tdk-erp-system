      - "traefik.http.routers.stock-movement-api.entrypoints=web"
      - "traefik.http.routers.stock-movement-api.service=stock-movement-api"

      - "traefik.http.services.stock-movement-api.loadbalancer.server.port=*backend-port"
      - "traefik.http.services.stock-movement-api.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.stock-movement-api.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.stock-movement-api.loadbalancer.healthcheck.timeout=5s"
      - "traefik.http.services.stock-movement-api.loadbalancer.healthcheck.followredirects=false"
      - "traefik.docker.network=tdk_erp_system_traefik-public"

      - "traefik.http.routers.stock-movement-api-project.rule=Host(`api.tdk-erp-system.localhost`) && PathPrefix(`/api/inventory-management`)"
      - "traefik.http.routers.stock-movement-api-project.entrypoints=web"
      - "traefik.http.routers.stock-movement-api-project.service=stock-movement-api"
      - "traefik.http.routers.stock-movement-api-project.middlewares=stock-movement-api-strip-prefix-project"
      - "traefik.http.middlewares.stock-movement-api-strip-prefix-project.stripprefix.prefixes=/api/inventory-management"
      - "traefik.http.routers.stock-movement-api-project.priority=125"

