      - RESOURCE_NAME=inventory
      - PORT=4207
      - INSTANCE_ID=0
      - NATS_QUEUE_GROUP=inventory_backend_svc
      - TILT_DATABASE_URL=postgresql://tdk_erp_system:${DB_PASSWORD}@tdk_erp_system_postgres:5432/tdk_erp_system_inventory?schema=public
      - TILT_NATS_URL=nats://tdk_erp_system_nats:4222
      - NODE_ENV=development
      - DATABASE_URL=postgresql://tdk_erp_system:${DB_PASSWORD}@tdk_erp_system_postgres:5432/tdk_erp_system_inventory?schema=public
      - AUTH_MODE=identity-service
      - IDENTITY_RESOURCE_URL=${IDENTITY_RESOURCE_URL:-None}
